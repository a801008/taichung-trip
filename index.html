        ]

      {

        items: [
          { id: "d2-1", time: "早上", type: "location", title: "東海牛棚背包客棧", desc: "退房吃早午餐", address: "臺中市龍井區新東里台灣大道五段3巷42弄22號" },

          { id: "d2-t2", time: "", type: "transit", title: "車程預估", desc: "約 10 分鐘" },
          { id: "d2-3", time: "12:00~14:00", type: "location", title: "Escer異世客 華美店", desc: "【暗影潛行】共8人 1000/人", address: "臺中市西屯區何福里寧漢二街7號" },

          { id: "d2-t4", time: "", type: "transit", title: "車程預估", desc: "約 40 分鐘" },

          { id: "d2-6", time: "19:00~21:00", type: "location", title: "哇沙謎二館", desc: "【秘令2】共7人 700/人", address: "臺中市豐原區中陽里自強街77號" },
          { id: "d2-t6", time: "", type: "transit", title: "車程預估", desc: "約 2.5 - 3 小時" },
          { id: "d2-7", time: "21:30出發", type: "location", title: "撤離回高雄", desc: "預計凌晨1點抵達小港站", address: "高雄市小港區二苓里沿海一路280號" },
        ]
      }
    ];

    const storesData = [
      { id: 1, name: "哇沙謎江戶時代館", address: "臺中市北區梅川里永興街370號B1之4", phone: "0909-317-006", games: "時光列車、冒險王" },
      { id: 2, name: "Loop迴圈密室逃脫旗艦店", address: "臺中市北屯區文心路四段188號", phone: "04-2238-6610", games: "頭七" },
      { id: 3, name: "Escer異世客 華美店", address: "臺中市西屯區何福里寧漢二街7號", phone: "04-2313-0819", games: "暗影潛行" },
      { id: 4, name: "笨蛋工作室 美村旗艦館", address: "臺中市西區忠明里美村路一段36號B1", phone: "04-2322-0611", games: "平安戲院" },
      { id: 5, name: "哇沙謎創意工作室二館", address: "臺中市豐原區中陽里自強街77號", phone: "0988-129-373", games: "秘令2" },
    ];

    const PARTICIPANTS = ['小開', '雨婷', '柚子', '魚魚', '小若', 'NICK', '阿姚', '榮森', '賀密'];

    const ItineraryTab = ({ notes, handleSaveNote }) => {
      const [editingId, setEditingId] = useState(null);
      const [tempNote, setTempNote] = useState("");

      const handleEdit = (id, currentNote) => {
        setEditingId(id);
        setTempNote(currentNote || "");
      };

      const onSave = (id) => {
        handleSaveNote(id, tempNote);
        setEditingId(null);
      };

      return (
        <div className="p-4">
          <h2 className="text-2xl font-bold text-yellow-500 mb-6 flex items-center gap-2 border-b border-yellow-700 pb-2">
            <Icon name="MapIcon" className="text-yellow-400" /> 行動路徑
          </h2>
          
          {itineraryData.map((dayData, dayIdx) => (
            <div key={dayIdx} className="mb-8">
              <h3 className="text-xl font-bold text-gray-200 mb-4 bg-gray-900 p-2 rounded border-l-4 border-yellow-500">
                {dayData.day}
              </h3>
              <div className="relative border-l-2 border-yellow-700/50 ml-4 pl-6 space-y-6">
                {dayData.items.map((item, index) => {
                  let navUrl = "";
                  if (item.type === 'location' && item.address) {
                    const prevLocations = dayData.items.slice(0, index).filter(i => i.type === 'location' && i.address);
                    const prevLocation = prevLocations.length > 0 ? prevLocations[prevLocations.length - 1] : null;
                    if (prevLocation) {
                      navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(prevLocation.address)}&destination=${encodeURIComponent(item.address)}`;
                    } else {
                      navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address)}`;
                    }
                  }

                  return (
                    <div key={item.id} className="relative">
                      {item.type === 'location' ? (
                        <div className="absolute -left-[35px] bg-gray-900 border-2 border-yellow-500 rounded-full p-1 shadow-[0_0_10px_rgba(234,179,8,0.5)]">
                          <Icon name="MapPin" size={16} className="text-yellow-400" />
                        </div>
                      ) : (
                        <div className="absolute -left-[31px] bg-gray-800 border-2 border-gray-600 rounded-full p-1 mt-1">
                          <Icon name="Car" size={12} className="text-gray-400" />
                        </div>
                      )}

                      <div className={`p-3 rounded-lg ${item.type === 'location' ? 'bg-gray-800/80 border border-gray-700' : 'bg-transparent text-gray-400'}`}>
                        {item.time && <span className="text-yellow-600 text-sm font-mono font-bold">{item.time}</span>}
                        <div className="flex justify-between items-start mt-1">
                          <div>
                            <h4 className={`font-bold ${item.type === 'location' ? 'text-yellow-100 text-lg' : 'text-gray-400 text-sm'}`}>{item.title}</h4>
                            <p className="text-gray-300 text-sm mt-1">{item.desc}</p>
                          </div>
                          {item.type === 'location' && navUrl && (
                            <a href={navUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 bg-yellow-600/20 hover:bg-yellow-600/40 text-yellow-500 border border-yellow-600/50 px-2 py-1 rounded text-xs font-bold transition-colors shrink-0 ml-2">
                              <Icon name="Navigation" size={14} /> 導航
                            </a>
                          )}
                        </div>
                        
                        {item.type === 'location' && (
                          <div className="mt-3 pt-3 border-t border-gray-700">
                            {editingId === item.id ? (
                              <div className="flex gap-2">
                                <input type="text" className="flex-1 bg-gray-950 border border-yellow-700 text-white p-2 rounded text-sm focus:outline-none focus:border-yellow-400" placeholder="輸入備註事項..." value={tempNote} onChange={(e) => setTempNote(e.target.value)} />
                                <button onClick={() => onSave(item.id)} className="bg-yellow-600 hover:bg-yellow-500 text-black p-2 rounded transition-colors">
                                  <Icon name="Check" size={16} />
                                </button>
                              </div>
                            ) : (
                              <div className="flex justify-between items-start gap-2 group">
                                <p className="text-sm text-gray-400 italic flex-1">{notes[item.id] ? `備註: ${notes[item.id]}` : '新增備註...'}</p>
                                <button onClick={() => handleEdit(item.id, notes[item.id])} className="text-gray-500 hover:text-yellow-400 p-1">

    const StoreCard = ({ store }) => {
      const [expanded, setExpanded] = useState(false);
      return (
        <div className="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden mb-4 transition-all duration-300 shadow-lg hover:border-yellow-600/50" onClick={() => setExpanded(!expanded)}>
          <div className="p-4 flex justify-between items-center cursor-pointer bg-gradient-to-r from-gray-800 to-gray-900">
            <h3 className="font-bold text-yellow-500 text-lg">{store.name}</h3>
            {expanded ? <Icon name="ChevronUp" className="text-yellow-600" /> : <Icon name="ChevronDown" className="text-gray-500" />}
          </div>
          {expanded && (
            <div className="p-4 border-t border-gray-700 bg-gray-800/50 space-y-3">
              <div className="flex items-start gap-3">
                <Icon name="MapPin" className="text-yellow-600 mt-1 flex-shrink-0" size={18} />
                <span className="text-gray-200">{store.address}</span>
              </div>
              <div className="flex items-start gap-3">
                <Icon name="Clock" className="text-yellow-600 mt-1 flex-shrink-0" size={18} />
                <span className="text-gray-200">{store.phone}</span>
              </div>
              <div className="mt-4 p-3 bg-gray-900 rounded border border-yellow-900/50">
                <span className="text-xs text-yellow-600 uppercase tracking-widest block mb-1">Target Mission</span>
                <span className="font-bold text-yellow-100">{store.games}</span>
              </div>
            </div>
          )}
        </div>
      );
    };

    const StoresTab = () => (
      <div className="p-4">
        <h2 className="text-2xl font-bold text-yellow-500 mb-6 flex items-center gap-2 border-b border-yellow-700 pb-2">
          <Icon name="Search" className="text-yellow-400" /> 情報局店家
        </h2>
        <div className="space-y-4">
          {storesData.map(store => <StoreCard key={store.id} store={store} />)}
        </div>
      </div>
    );

    const ExpensesTab = ({ expenses, handleAddExpense, handleDeleteExpense }) => {
      const [newItem, setNewItem] = useState("");
      const [newAmount, setNewAmount] = useState("");
      const [payer, setPayer] = useState(PARTICIPANTS[0]);
      const [splitType, setSplitType] = useState('all');
      const [splitAmong, setSplitAmong] = useState([...PARTICIPANTS]);
      const [showSettlement, setShowSettlement] = useState(false);

      const toggleParticipant = (name) => {
        setSplitAmong(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
      };

      const onSubmit = (e) => {
        e.preventDefault();
        const amountNum = parseInt(newAmount, 10);
        if (!newItem.trim() || isNaN(amountNum) || amountNum <= 0) return;
        if (splitType === 'custom' && splitAmong.length === 0) return;
        const finalSplit = splitType === 'all' ? [...PARTICIPANTS] : splitAmong;
        
        handleAddExpense({ name: newItem, amount: amountNum, payer: payer, splitAmong: finalSplit });
        
        setNewItem(""); setNewAmount(""); setSplitType('all'); setSplitAmong([...PARTICIPANTS]);
      };

      const balances = {};
      PARTICIPANTS.forEach(p => balances[p] = 0);
      expenses.forEach(exp => {
        const expPayer = exp.payer || PARTICIPANTS[0];
        const expSplitAmong = exp.splitAmong || [...PARTICIPANTS];
        if (balances[expPayer] !== undefined) balances[expPayer] += exp.amount;
        if (expSplitAmong.length > 0) {
          const splitAmount = exp.amount / expSplitAmong.length;
          expSplitAmong.forEach(p => { if (balances[p] !== undefined) balances[p] -= splitAmount; });
        }
      });

      return (
        <div className="p-4 flex flex-col h-full">
          <div className="flex justify-between items-end border-b border-yellow-700 pb-2 mb-6">
            <h2 className="text-2xl font-bold text-yellow-500 flex items-center gap-2">
              <Icon name="CircleDollarSign" className="text-yellow-400" /> 軍費管理
            </h2>
            <button onClick={() => setShowSettlement(!showSettlement)} className="text-sm bg-yellow-600/20 text-yellow-400 border border-yellow-600 px-3 py-1 rounded hover:bg-yellow-600/40">
              {showSettlement ? "隱藏結算" : "查看結算表"}
            </button>
          </div>

          {showSettlement && (
            <div className="bg-gray-900 border border-yellow-600 p-4 rounded-xl mb-6 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
              <h3 className="text-lg font-bold text-yellow-500 mb-3 border-b border-gray-700 pb-2 flex justify-between">
                <span>個人結算狀態</span>
                <span className="text-xs text-gray-400 font-normal self-end mb-1">正數為應收 / 負數為應付</span>
              </h3>
              <div className="grid grid-cols-2 gap-3">
                {PARTICIPANTS.map(p => {
                  const balance = balances[p];
                  return (
                    <div key={p} className="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700">
                      <span className="text-gray-300 font-medium">{p}</span>
                      {balance > 0.01 ? (
                        <span className="text-green-400 font-mono text-sm font-bold">+${Math.round(balance)}</span>
                      ) : balance < -0.01 ? (
                        <span className="text-red-400 font-mono text-sm font-bold">-${Math.abs(Math.round(balance))}</span>
                      ) : (
                        <span className="text-gray-500 text-sm">結清</span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <form onSubmit={onSubmit} className="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6 shadow-lg">
            <h3 className="text-sm text-yellow-600 uppercase tracking-widest mb-3 font-bold">新增帳單</h3>
            <div className="space-y-3">
              <div className="flex gap-2">
                <input type="text" placeholder="項目 (例: 租車)" className="flex-1 bg-gray-900 border border-gray-600 text-white p-2 rounded-lg focus:outline-none focus:border-yellow-500" value={newItem} onChange={(e) => setNewItem(e.target.value)} />
                <input type="number" placeholder="總額" className="w-24 bg-gray-900 border border-gray-600 text-white p-2 rounded-lg focus:outline-none focus:border-yellow-500" value={newAmount} onChange={(e) => setNewAmount(e.target.value)} />
              </div>
              <div className="flex items-center gap-2 bg-gray-900/50 p-2 rounded border border-gray-700">
                <span className="text-gray-400 text-sm whitespace-nowrap pl-1">代墊人:</span>
                <select className="flex-1 bg-transparent text-yellow-400 font-bold p-1 focus:outline-none" value={payer} onChange={(e) => setPayer(e.target.value)}>
                  {PARTICIPANTS.map(p => <option key={p} value={p} className="bg-gray-900 text-white">{p}</option>)}
                </select>
              </div>
              <div className="pt-2 border-t border-gray-700">
                <div className="flex gap-4 mb-3">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="splitType" checked={splitType === 'all'} onChange={() => setSplitType('all')} className="accent-yellow-500 w-4 h-4" />
                    <span className="text-sm text-gray-300">全員均分</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="splitType" checked={splitType === 'custom'} onChange={() => setSplitType('custom')} className="accent-yellow-500 w-4 h-4" />
                    <span className="text-sm text-gray-300">自訂分攤</span>
                  </label>
                </div>
                {splitType === 'custom' && (
                  <div className="grid grid-cols-3 gap-2 mt-2 bg-gray-900 p-3 rounded-lg border border-gray-700">
                    {PARTICIPANTS.map(p => (
                      <label key={p} className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={splitAmong.includes(p)} onChange={() => toggleParticipant(p)} className="accent-yellow-500 w-4 h-4 rounded" />
                        <span className={`text-sm ${splitAmong.includes(p) ? 'text-yellow-400 font-bold' : 'text-gray-400'}`}>{p}</span>
                      </label>
                    ))}
                  </div>
                )}
              </div>
              <button type="submit" className="w-full bg-yellow-600 hover:bg-yellow-500 text-black p-3 rounded-lg flex items-center justify-center gap-2 font-black mt-2">
                <Icon name="Plus" size={18} /> 加入雲端帳單
              </button>
            </div>
          </form>

          <div className="flex-1 overflow-y-auto space-y-4 pb-24">
            {expenses.length === 0 ? (
              <p className="text-center text-gray-500 py-8 bg-gray-800/30 rounded-xl border border-gray-800 border-dashed">尚無帳單紀錄</p>
            ) : (
              expenses.map((item, index) => {
                const expSplitAmong = item.splitAmong || [...PARTICIPANTS];
                const expPayer = item.payer || PARTICIPANTS[0];
                const perPerson = expSplitAmong.length > 0 ? Math.round(item.amount / expSplitAmong.length) : 0;
                
                return (
                  <div key={item.id} className="bg-gray-800/80 rounded-xl border border-gray-700 p-4 relative">
                    <button onClick={() => handleDeleteExpense(item.id)} className="absolute top-4 right-4 text-gray-600 hover:text-red-400 bg-gray-900 p-1.5 rounded-md">
                      <Icon name="Trash2" size={16} />
                    </button>
                    <div className="pr-10">
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-[10px] bg-yellow-600/20 text-yellow-500 px-1.5 py-0.5 rounded font-mono">#{index + 1}</span>
                        <h4 className="text-lg font-bold text-gray-100">{item.name}</h4>
                      </div>
                      <div className="text-2xl font-black text-yellow-500 font-mono tracking-wider mb-3">
                        NT$ {item.amount.toLocaleString()}
                      </div>
                    </div>
                    <div className="mt-2 pt-3 border-t border-gray-700/50 text-sm space-y-2">
                      <div className="flex items-center text-gray-300 bg-gray-900/50 p-1.5 rounded">
                        <span className="text-gray-500 w-12 text-xs">代墊人</span>
                        <span className="font-bold text-yellow-300">{expPayer}</span>
                      </div>
                      <div className="flex items-start text-gray-300 bg-gray-900/50 p-1.5 rounded">
                        <span className="text-gray-500 w-12 text-xs mt-0.5">需分攤</span>
                        <div className="flex-1">
                          <div className="text-yellow-600 font-mono text-xs mb-1">( 每人 NT$ {perPerson} )</div>
                          <div className="text-xs leading-relaxed">
                            {expSplitAmong.length === PARTICIPANTS.length ? (
                              <span className="text-blue-300 border border-blue-800 bg-blue-900/30 px-1.5 py-0.5 rounded">全員均分</span>
                            ) : (
                              <span className="text-gray-400">{expSplitAmong.join('、')}</span>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('itinerary');
      const [notes, setNotes] = useState({});
      const [expenses, setExpenses] = useState([]);
      const [syncStatus, setSyncStatus] = useState('🟡 連線中...');

      useEffect(() => {
        const setupFirebase = async () => {
          if (!window.fs) {
            setSyncStatus('🔴 無法連線');
            return;
          }

          const { collection, onSnapshot, doc } = window.fs;
          
          try {
            // 1. 同步「備註」資料
            const notesDocRef = doc(window.db, "taichung_trip", "notes_data");
            onSnapshot(notesDocRef, (docSnap) => {
              if (docSnap.exists()) {
                setNotes(docSnap.data());
              }
            });

            // 2. 同步「軍費」資料
            const expensesColRef = collection(window.db, "taichung_trip_expenses");
            onSnapshot(expensesColRef, (snapshot) => {
              const exps = [];
              snapshot.forEach((docSnap) => {
                exps.push({ id: docSnap.id, ...docSnap.data() });
              });
              // 按照建立時間排序
              exps.sort((a, b) => a.createdAt - b.createdAt);
              setExpenses(exps);
              setSyncStatus('🟢 雲端同步中');
            }, (error) => {
              console.error(error);
              setSyncStatus('🔴 連線失敗');
            });

          } catch (error) {
            console.error("Firebase 連線錯誤:", error);
            setSyncStatus('🔴 連線失敗');
          }
        };

        // 監聽 Firebase 載入完成事件
        if (window.fs) {
          setupFirebase();
        } else {
          window.addEventListener('firebaseReady', setupFirebase);
        }
        
        return () => window.removeEventListener('firebaseReady', setupFirebase);
      }, []);

      // 儲存備註到雲端
      const handleSaveNote = async (id, text) => {
        const { doc, setDoc } = window.fs;
        const newNotes = { ...notes, [id]: text };
        setNotes(newNotes); // 先更新畫面
        try {
          await setDoc(doc(window.db, "taichung_trip", "notes_data"), newNotes, { merge: true });
        } catch (e) {
          alert("儲存失敗，請檢查網路連線");
        }
      };

      // 新增軍費到雲端
      const handleAddExpense = async (expenseData) => {
        const { doc, setDoc } = window.fs;
        const expenseId = Date.now().toString(); // 用時間戳當 ID
        const newExpense = {
          ...expenseData,
          createdAt: Date.now()
        };
        try {
          await setDoc(doc(window.db, "taichung_trip_expenses", expenseId), newExpense);
        } catch (e) {
          alert("新增失敗，請檢查網路連線");
        }
      };

      // 刪除雲端軍費
      const handleDeleteExpense = async (id) => {
        if(!confirm("確定要刪除這筆帳單嗎？")) return;
        const { doc, deleteDoc } = window.fs;
        try {
          await deleteDoc(doc(window.db, "taichung_trip_expenses", id));
        } catch (e) {
          alert("刪除失敗，請檢查網路連線");
        }
      };

      return (
        <div className="min-h-screen bg-[#0a0a0a] text-gray-200 pb-[72px]">
          <header className="bg-black border-b border-yellow-900/50 p-4 sticky top-0 z-20 shadow-lg shadow-black/50 relative">
            <h1 className="text-center text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 tracking-wider">
              謎霧行動：台中48小時
            </h1>
            <span className="absolute top-2 right-2 text-[10px] bg-gray-900 px-2 py-1 rounded-full border border-gray-700 text-gray-400 shadow-sm">
              {syncStatus}
            </span>
          </header>

          <main className="max-w-md mx-auto w-full">
            {activeTab === 'itinerary' && <ItineraryTab notes={notes} handleSaveNote={handleSaveNote} />}
            {activeTab === 'stores' && <StoresTab />}
            {activeTab === 'expenses' && <ExpensesTab expenses={expenses} handleAddExpense={handleAddExpense} handleDeleteExpense={handleDeleteExpense} />}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-black border-t border-gray-800 z-30 pb-safe">
            <div className="flex justify-around items-center max-w-md mx-auto h-[72px]">
              <button onClick={() => setActiveTab('itinerary')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'itinerary' ? 'text-yellow-500' : 'text-gray-500'}`}>
                <Icon name="MapIcon" size={24} />
                <span className="text-xs font-medium">行動路徑</span>
              </button>
              <button onClick={() => setActiveTab('stores')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'stores' ? 'text-yellow-500' : 'text-gray-500'}`}>
                <Icon name="Search" size={24} />
                <span className="text-xs font-medium">情報局</span>
              </button>
              <button onClick={() => setActiveTab('expenses')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'expenses' ? 'text-yellow-500' : 'text-gray-500'}`}>
                <Icon name="CircleDollarSign" size={24} />
                <span className="text-xs font-medium">軍費管理</span>
              </button>
            </div>
          </nav>
        </div>
      );
    };

    // 啟動 React 應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
